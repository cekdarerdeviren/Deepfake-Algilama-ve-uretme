<!DOCTYPE html>
<html lang="en">
    <head>
            <meta charset="UTF-8">
            <title>DeepFake Algılama</title>
    </head>
    <body>
        <h1>DeepFake Algılama</h1>
        <p>Bu sayfa, DeepFake videolarını algılamak için bir araç sunmaktadır.</p>
        <form action="/detect" method="post" enctype="multipart/form-data">
            <label for="video">Video Yükle:</label>
            <input type="file" id="video" name="video" accept="video/*" required>
            <button type="submit">Algıla</button>
        </form>
        <div id="result">
</html>
